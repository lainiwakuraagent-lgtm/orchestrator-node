scope_id: 2
scope_name: "Code & Architecture"
scope_slug: code

context_files:
  - memory/latest_summary.md
  - memory/learnings_digest.md
  - state/behavioral_context.txt
  - prompts/wrapper_prompt.md
  - logs/maintenance_decisions.md

focus_hint: >
  Code & Architecture maintenance. Audit prompts/wrapper_prompt.md for accuracy
  against how the system actually behaves now -- stale instructions, references
  to files or tools that no longer exist. Verify wake.sh's dynamic goal text
  matches Loom's resolved active goal, and that DEFAULT_GOAL_ID in
  state/agent_config.env, if set, still points at a real goal.
  Check config/session_types/*.yaml for stale context_files references --
  paths that no longer exist, or files that moved since the config was written.
  Run scripts/executional/tag_skill_lookup.py --validate-all to catch broken SOP resolution.
  Scan scripts/ and tools/ for hardcoded absolute paths or other machine-specific
  assumptions -- anything that only works on the exact machine it was written on
  is a recurring drift pattern worth catching early.
  If .claude/architecture/ diagrams exist, check them against the current
  codebase structure for staleness.
  Review logs/maintenance_decisions.md for proposed code changes that were
  logged but never acted on, or acted on differently than documented.
  Goal: a clean, internally-consistent execution layer -- no stale references
  between config, prompts, and scripts.
